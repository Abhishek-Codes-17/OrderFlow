name: OrderFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Java tests
        run: ./mvnw test

  python-tests:
    name: Python Pricing Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pricing-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pricing-service/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pricing service tests
        run: python -m pytest -v