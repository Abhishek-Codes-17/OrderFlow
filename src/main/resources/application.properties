spring.application.name=OrderFlow

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
spring.datasource.username=${DB_USERNAME:orderflow}
spring.datasource.password=${DB_PASSWORD:orderflow}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=orderflow
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.abhishek.orderflow.event

orderflow.kafka.topics.order-events=order-events

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

orderflow.pricing.cache.ttl-minutes=5

# FastAPI Pricing Service
orderflow.pricing.base-url=${PRICING_SERVICE_URL:http://localhost:8000}